name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.85 is rust-version in Cargo.toml; stable catches new lints and breakage early.
        toolchain: ["1.85", "stable"]
    name: cargo test (rust ${{ matrix.toolchain }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --locked --all-targets
